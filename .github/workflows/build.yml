name: Build spotifast Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4

      # 1. Cargar el entorno de Visual Studio 2022 (evita el error 'could not find any instance of Visual Studio')
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Instalar LLVM para bindgen
      - name: Install LLVM
        run: choco install llvm -y

      # 3. Instalar GLEW estático con vcpkg
      - name: Install vcpkg dependencies
        run: |
          vcpkg install glew:x64-windows-static

      # 4. Configurar la toolchain de Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 5. Compilar con Cargo en Release con todas las variables de entorno pasadas a cmake-rs
      - name: Build with Cargo
        run: cargo build --release --verbose
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      # 6. Guardar los ejecutables generados
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Path target/release -Filter "*.exe" | Copy-Item -Destination output/

      # 7. Subir el artefacto
      - name: Upload spotifast artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifast-windows-x64
          path: output/
