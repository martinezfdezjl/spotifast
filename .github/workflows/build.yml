name: Build Spotijow Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4

      # 1. Carga el entorno de Visual Studio del runner
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Instala GLEW estático requerido por libprojectM
      - name: Install vcpkg dependencies
        run: |
          vcpkg install glew:x64-windows-static

      # 3. Configura el compilador de Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Compilación con Cargo (forzando Ninja para esquivar el hardcode de VS 2022)
      - name: Build with Cargo
        run: cargo build --release --verbose
        env:
          CMAKE_GENERATOR: Ninja
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg

      # 5. Empaqueta el ejecutable y lo renombra a Spotijow.exe
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $exe = Get-ChildItem -Path target/release -Filter "*.exe" | Where-Object { $_.Name -notmatch "build_script" } | Select-Object -First 1
          if ($exe) {
              Copy-Item $exe.FullName -Destination "output/Spotijow.exe"
          }

      # 6. Sube el zip Spotijow-windows-x64 listo para descargar
      - name: Upload spotifast artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotijow-windows-x64
          path: output/
