name: Build spotifast Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Configura el entorno oficial de Visual Studio 2022 (x64)
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Instala la dependencia necesaria con vcpkg
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install glew:x64-windows-static

      # 3. Clona y compila libprojectM con Ninja + Clang-CL
      - name: Clone and build libprojectM
        run: |
          git clone --recursive --branch v3.1.12 https://github.com/projectM-visualizer/projectm.git projectm
          cmake -B projectm/build -S projectm -G Ninja ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\install_projectm"
          cmake --build projectm/build --target install
        shell: cmd

      # 4. Configura y compila spotifast
      - name: Configure and build spotifast
        run: |
          cmake -B build -S . -G Ninja ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\install_projectm"
          cmake --build build
        shell: cmd

      # 5. Empaqueta el ejecutable y librerías resultantes
      - name: Prepare build artifacts
        run: |
          mkdir output
          if exist build\spotifast.exe copy build\spotifast.exe output\
          if exist install_projectm\bin\*.dll copy install_projectm\bin\*.dll output\
        shell: cmd

      # 6. Sube el ZIP listo para descargar
      - name: Upload spotifast artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifast-windows-x64
          path: output/
