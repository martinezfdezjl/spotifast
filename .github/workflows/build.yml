name: Build spotifast Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4

      # 1. Configura el entorno nativo de Visual Studio (carga cl.exe, LIB, INCLUDE)
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Instalar GLEW estático con vcpkg
      - name: Install vcpkg dependencies
        run: |
          vcpkg install glew:x64-windows-static

      # 3. Toolchain de Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Compilación con Cargo forzando Ninja en cmake-rs
      - name: Build with Cargo
        run: cargo build --release --verbose
        env:
          CMAKE_GENERATOR: Ninja
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      # 5. Empaquetar y renombrar como Spotijow.exe
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          if (Test-Path "target/release/spotifast.exe") {
              Copy-Item "target/release/spotifast.exe" -Destination "output/Spotijow.exe"
          } else {
              Get-ChildItem -Path target/release -Filter "*.exe" | Copy-Item -Destination "output/"
          }

      # 6. Subir el artefacto
      - name: Upload spotifast artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotijow-windows-x64
          path: output/
