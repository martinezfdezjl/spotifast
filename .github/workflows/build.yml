name: Build spotifast Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4

      # 1. Configurar LLVM (requerido para bindgen si compila bindings C)
      - name: Install LLVM
        run: choco install llvm -y

      # 2. Instalar dependencias nativas vía vcpkg
      - name: Install vcpkg dependencies
        run: |
          vcpkg install glew:x64-windows-static
        env:
          VCPKG_ROOT: C:\vcpkg

      # 3. Configurar entorno de Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Compilar con Cargo en Release
      - name: Build with Cargo
        run: cargo build --release --verbose
        env:
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      # 5. Empaquetar el ejecutable resultante
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Path target/release -Filter "*.exe" | Copy-Item -Destination output/

      # 6. Subir el artefacto
      - name: Upload spotifast artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifast-windows-x64
          path: output/
