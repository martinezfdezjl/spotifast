name: Build spotifast Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout spotifast
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inspect repository contents
        shell: cmd
        run: |
          echo "=== ARCHIVOS EN LA RAIZ ==="
          dir /b
          echo "=== PROYECTOS ENCONTRADOS ==="
          dir /s /b *.sln *.vcxproj CMakeLists.txt Makefile
